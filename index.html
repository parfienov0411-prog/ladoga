<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Ладога КДТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: пульт диспетчера — слева экран (радар / график ПК / табличный график), справа эфир с полем передачи; на телефоне — экран сверху, эфир снизу */
:root {
  --bg: #e7e4ec;        /* светлый «дневной» фон КДТ «Навигатор» */
  --panel: #f5f3f8;
  --paper: #ffffff;     /* бумага графика */
  --ink: #1d1a2c;
  --muted: #6a6480;
  --line: #d3cddc;
  --accent: #4a3dbd;    /* фиолетовые трассы как на экране КДТ */
  --accent-soft: #e2defa;
  --sector: #e9bccb;    /* розовые зоны */
  --route: #8d86d8;
  --target: #138a4e;
  --warn: #c27412;
  --bad: #c23649;
  --good: #1b8a52;
  --callout: #e0722a;   /* оранжевые выноски методички */
  --evs: #e9e7ee;       /* серая полоса реплик ЭВС, как в ФРО */
  --radar-bg: #ece9f1;
  --radar-grid: #d6d0df;
  --font-ui: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-data: "IBM Plex Mono", "Consolas", "Menlo", monospace;
  --font-display: "Unbounded", "IBM Plex Sans Condensed", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111019; --panel: #1a1925; --paper: #f2f0f6; --ink: #e9e6f3; --muted: #9a94b2; --line: #2d2a3e;
  --accent: #9a8fff; --accent-soft: #2a2650; --sector: #5b2b42; --route: #6a62c4; --target: #3ddc8a; --warn: #f0a640;
  --bad: #ff6b7d; --good: #4fd18c; --callout: #f08a40; --evs: #232131; --radar-bg: #0f1420; --radar-grid: #1c2536; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111019; --panel: #1a1925; --paper: #f2f0f6; --ink: #e9e6f3; --muted: #9a94b2; --line: #2d2a3e;
  --accent: #9a8fff; --accent-soft: #2a2650; --sector: #5b2b42; --route: #6a62c4; --target: #3ddc8a; --warn: #f0a640;
  --bad: #ff6b7d; --good: #4fd18c; --callout: #f08a40; --evs: #232131; --radar-bg: #0f1420; --radar-grid: #1c2536; color-scheme: dark; }
html, body, #app { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.4; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.wrap { padding-inline: 16px; padding-block: 12px; max-width: 1480px; margin: 0 auto; }

/* ── шапка */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .02em; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-family: var(--font-data); font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.top .sp { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
.chip b { font-weight: 600; }
.clock { font-family: var(--font-data); font-weight: 600; font-size: 22px; letter-spacing: .04em; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--paper); border-color: var(--accent); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: default; }

/* ── главный экран */
.home { display: grid; gap: 22px; padding-block: 8px 40px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 5vw, 54px); line-height: 1.02; margin: 0 0 12px; text-wrap: balance; letter-spacing: -.01em; }
.hero h1 span { color: var(--accent); }
.hero p { margin: 0; max-width: 58ch; color: var(--muted); font-size: 16px; }
.hero canvas { width: 100%; max-width: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--radar-bg); border: 1px solid var(--line); }
.stats { display: flex; gap: 22px; margin-top: 18px; flex-wrap: wrap; }
.stats div { display: grid; }
.stats b { font-family: var(--font-data); font-size: 22px; }
.stats span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.setup { display: grid; gap: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.setup h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.opt { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 13px; text-align: left; min-width: 0; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.opt b { display: block; font-weight: 600; }
.opt small { display: block; color: var(--muted); font-size: 12.5px; }
.roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.role-group { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); grid-column: 1 / -1; margin-top: 4px; }
.go { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.links { display: flex; gap: 10px; flex-wrap: wrap; }

/* ── упражнение */
.ex { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(340px, 1fr); gap: 14px; height: calc(100% - 58px); padding-bottom: 12px; }
.screen, .radio { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.tabs { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--line); align-items: center; overflow-x: auto; scrollbar-width: none; }
.tab { white-space: nowrap; }
.tab { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 500; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--callout); margin-left: 6px; vertical-align: middle; }
.view { flex: 1; min-height: 0; position: relative; }
#radar { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.rctl { position: absolute; right: 10px; top: 10px; display: grid; gap: 6px; }
.rctl button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; }
.rinfo { position: absolute; left: 10px; bottom: 10px; font-family: var(--font-data); font-size: 12px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; line-height: 1.5; }

/* график ПК — бумага методички */
.gwrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
.gbar { display: flex; gap: 6px; padding: 8px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tool { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 10px; font-family: var(--font-data); font-size: 13px; }
.tool[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.task { margin-left: auto; font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.task .pill { background: var(--callout); color: #fff; border-radius: 6px; padding: 3px 8px; font-weight: 600; }
.task .ok { color: var(--good); font-weight: 600; }
.gscroll { flex: 1; overflow: auto; background: var(--paper); }
#graph { display: block; }
#graph text { font-family: var(--font-data); }
.gmsg { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 7px 14px; border-radius: 8px; font-size: 13.5px; max-width: 92%; pointer-events: none; transition: opacity .25s; }
.gmsg.bad { background: var(--bad); color: #fff; }
.pop { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; box-shadow: 0 8px 28px rgba(20, 16, 40, .22); display: grid; gap: 8px; z-index: 5; width: min(320px, 92%); }
.pop label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.pop input { font-family: var(--font-data); font-size: 15px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.pop .row { display: flex; gap: 8px; justify-content: flex-end; }
.pop .err { color: var(--bad); font-size: 13px; }

/* табличный график */
.tbl { padding: 12px; overflow: auto; position: absolute; inset: 0; }
.tbl table { border-collapse: collapse; width: 100%; min-width: 560px; background: var(--paper); color: #1d1a2c; font-family: var(--font-data); font-size: 13.5px; }
.tbl th, .tbl td { border: 1px solid #9c97ab; padding: 6px 8px; text-align: left; }
.tbl th { background: #eeedf3; font-family: var(--font-ui); font-weight: 600; }
.tbl input { width: 100%; font-family: var(--font-data); font-size: 13.5px; border: 1px dashed var(--callout); background: #fff8f2; padding: 4px 5px; color: #1d1a2c; }
.tbl .note { color: var(--muted); font-size: 13px; margin: 10px 0 0; max-width: 70ch; }
.strip { padding: 14px; display: grid; gap: 10px; font-family: var(--font-data); font-size: 14px; position: absolute; inset: 0; overflow: auto; }
.strip .card { background: var(--paper); color: #1d1a2c; border-left: 6px solid var(--accent); border-radius: 6px; padding: 12px 14px; display: grid; gap: 4px; }
.strip .card .big { font-size: 22px; font-weight: 600; }

/* эфир */
.rhead { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.rhead .freq { font-family: var(--font-data); font-size: 18px; font-weight: 600; }
.rhead .st { font-size: 13px; color: var(--muted); }
.log { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; scroll-behavior: smooth; }
.ln { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 5px 8px; border-radius: 6px; font-size: 14px; animation: in .25s ease-out; }
@keyframes in { from { opacity: .2; transform: translateY(4px); } }
.ln .who { font-family: var(--font-data); font-size: 11px; color: var(--muted); padding-top: 2px; line-height: 1.25; }
.ln .who b { display: block; color: var(--ink); font-size: 12px; }
.ln.evs { background: var(--evs); }
.ln.coord { border-left: 3px solid var(--callout); padding-left: 6px; }
.ln.coord .tx { font-style: italic; }
.ln.me { background: var(--accent-soft); }
.ln .tx { min-width: 0; overflow-wrap: anywhere; }
.ln .fb { grid-column: 2; font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.fb .e { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); border-radius: 5px; padding: 1px 6px; }
.fb .w { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); border-radius: 5px; padding: 1px 6px; }
.fb .g { color: var(--good); font-weight: 600; }
.fb .ref { color: var(--muted); width: 100%; }
.sep { text-align: center; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; display: flex; gap: 8px; align-items: center; }
.sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.ptt { border-top: 1px solid var(--line); padding: 10px; display: grid; gap: 8px; background: var(--panel); }
.cue { font-size: 13.5px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.cue .to { font-family: var(--font-data); font-weight: 600; color: var(--accent); }
.cue .hintbox { width: 100%; font-family: var(--font-data); font-size: 13px; background: var(--bg); border: 1px dashed var(--line); border-radius: 6px; padding: 6px 8px; }
.inrow { display: flex; gap: 8px; align-items: flex-end; }
#say { flex: 1; min-width: 0; resize: none; font-family: var(--font-data); font-size: 15px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-height: 44px; max-height: 140px; }
#say:disabled { opacity: .55; }
.tx-btn { height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--accent); color: var(--paper); font-weight: 600; letter-spacing: .04em; }
.tx-btn:disabled { opacity: .4; }
.waiting { font-size: 13px; color: var(--muted); }

/* итоги */
.modal { position: fixed; inset: 0; background: rgba(15, 12, 30, .55); display: grid; place-items: center; z-index: 20; padding: 16px; }
.sheet { background: var(--panel); border-radius: 16px; padding: 22px; width: min(560px, 100%); max-height: 92%; overflow: auto; display: grid; gap: 14px; border: 1px solid var(--line); }
.grade { font-family: var(--font-display); font-size: 64px; line-height: 1; color: var(--accent); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kv div { background: var(--bg); border-radius: 10px; padding: 10px; }
.kv b { font-family: var(--font-data); font-size: 20px; display: block; }
.kv span { font-size: 12px; color: var(--muted); }
.errs { margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 4px; }
.errs i { color: var(--muted); font-style: normal; font-family: var(--font-data); font-size: 12.5px; }

/* сборник ФРО — как лист сборника */
.book { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; padding-block: 8px 40px; }
.toc { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; display: grid; gap: 6px; }
.toc a { color: var(--ink); text-decoration: none; padding: 5px 8px; border-radius: 6px; font-size: 14px; }
.toc a:hover { background: var(--panel); }
.sheetpaper { background: var(--paper); color: #1d1a2c; border-radius: 6px; padding: 26px clamp(14px, 4vw, 40px); box-shadow: 0 1px 0 var(--line); max-width: 860px; }
.sheetpaper h2 { margin: 0 0 4px; background: #1d1a2c; color: #fff; font-family: var(--font-ui); font-weight: 600; font-size: 20px; padding: 6px 14px; text-align: center; }
.sheetpaper h3 { display: flex; align-items: center; gap: 12px; font-family: var(--font-ui); font-weight: 700; font-size: 19px; margin: 26px 0 10px; }
.sheetpaper h3::before, .sheetpaper h3::after { content: ""; flex: 1; height: 2px; background: #1d1a2c; }
.fro { display: grid; grid-template-columns: 52px minmax(0, 1fr); font-family: "Times New Roman", "PT Serif", Georgia, serif; font-size: 16.5px; }
.fro > div { padding: 4px 8px; }
.fro .s { font-family: var(--font-ui); font-weight: 600; font-size: 14px; text-align: right; }
.fro .evs { background: #d9d8de; }
.fro .hid { color: transparent; background: repeating-linear-gradient(90deg, #ece9f3 0 8px, #e2deea 8px 16px); border-radius: 4px; cursor: pointer; user-select: none; }
.ctab { width: 100%; border-collapse: collapse; margin: 10px 0; font-family: "Times New Roman", "PT Serif", Georgia, serif; font-size: 16px; }
.ctab th, .ctab td { border: 1px solid #1d1a2c; padding: 5px 8px; vertical-align: top; width: 50%; }
.ctab th { font-family: var(--font-ui); }
.ref { display: grid; gap: 16px; padding-block: 8px 40px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.ref pre { margin: 0; white-space: pre-wrap; font-family: var(--font-data); font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow-x: auto; }

@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; }
  .hero canvas { max-width: 300px; justify-self: center; }
  .ex { grid-template-columns: 1fr; grid-template-rows: minmax(300px, 48vh) minmax(0, 1fr); height: auto; min-height: calc(100% - 58px); }
  .radio { min-height: 360px; }
  .book { grid-template-columns: 1fr; }
  .toc { position: static; display: flex; flex-wrap: wrap; }
  .clock { font-size: 18px; }
  .exchip { display: none; }
  .rinfo { font-size: 10.5px; padding: 4px 7px; }
  .ex { height: auto; }
}
@media (prefers-reduced-motion: reduce) { .ln { animation: none; } .log { scroll-behavior: auto; } }
</style>

// Масштаб карты по методичке: NOVIK 157°/156 км, PESKI 207°/247 км, TARTU 233°/258 км от LDM → 1,39 px/км.
const PX_PER_KM = 1.39, MAG_VAR = 11;
const xy = n => [POINTS[n][0], POINTS[n][1]];
const dkm = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]) / PX_PER_KM;
const tbrg = (a, b) => ((Math.atan2(b[0] - a[0], -(b[1] - a[1])) * 180 / Math.PI) + 360) % 360;
const mbrg = (a, b) => (tbrg(a, b) - MAG_VAR + 360) % 360;
function azDist(pos) { const c = xy('LADOGA'); return [Math.round(mbrg(c, pos)) % 360 || 360, Math.round(dkm(c, pos))]; }
const routeLen = names => names.slice(1).reduce((s, n, i) => s + dkm(xy(names[i]), xy(n)), 0);
const mm = t => String(((Math.round(t) % 60) + 60) % 60).padStart(2, '0');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
const rint = (r, a, b) => a + Math.floor(r() * (b - a + 1));

class Track {
  constructor(route, known) {
    this.route = route; const pts = route.map(xy); const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const idx = Object.entries(known).map(([n, t]) => [route.indexOf(n), t]).sort((a, b) => a[0] - b[0]);
    const times = new Array(route.length).fill(null); idx.forEach(([i, t]) => times[i] = t);
    for (let k = 0; k < idx.length - 1; k++) { const [i1, t1] = idx[k], [i2, t2] = idx[k + 1];
      for (let j = i1 + 1; j < i2; j++) times[j] = t1 + (cum[j] - cum[i1]) / ((cum[i2] - cum[i1]) || 1) * (t2 - t1); }
    let [ia, ta] = idx[idx.length - 2], [ib, tb] = idx[idx.length - 1]; let v = (cum[ib] - cum[ia]) / Math.max(tb - ta, .1);
    for (let j = ib + 1; j < route.length; j++) times[j] = tb + (cum[j] - cum[ib]) / v;
    [ia, ta] = idx[0]; [ib, tb] = idx[1]; v = (cum[ib] - cum[ia]) / Math.max(tb - ta, .1);
    for (let j = 0; j < ia; j++) times[j] = ta - (cum[ia] - cum[j]) / v;
    this.pts = pts; this.times = times;
  }
  pos(t) { const ts = this.times, ps = this.pts;
    if (t <= ts[0]) return [ps[0], this.hdg(0)];
    for (let i = 0; i < ts.length - 1; i++) if (t >= ts[i] && t <= ts[i + 1]) { const f = (t - ts[i]) / ((ts[i + 1] - ts[i]) || 1), a = ps[i], b = ps[i + 1]; return [[a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f], this.hdg(i)]; }
    return [ps[ps.length - 1], this.hdg(ps.length - 2)]; }
  hdg(i) { i = Math.max(0, Math.min(i, this.pts.length - 2)); return tbrg(this.pts[i], this.pts[i + 1]); }
  timeAt(name) { return this.times[this.route.indexOf(name)]; }
}

function commonVars(r) {
  const [type, heavy, reg] = pick(r, AIRCRAFT); const cs = `${pick(r, AIRLINES)}-${rint(r, 101, 989)}`;

  return { cs, type, heavy, reg: reg + rint(r, 100, 999), sq, atis: pick(r, ATIS), qnh: rint(r, 998, 1030), stand: rint(r, 101, 160),

}

class Builder {
  constructor(track) { Object.assign(this, { steps: [], tasks: [], t: 0, fl: 0, cfl: 0, stage: '', track }); }
  at(o) { Object.assign(this, o); return this; }
  say(speaker, listener, text, opt = {}) {
    const meta = {};
    if (opt.azd) { const [p] = this.track.pos(this.t); [meta.az, meta.dist] = azDist(p);
      if (opt.noAz) delete meta.az;
      text = text.replace('{AZ}', meta.az).replace('{DIST}', meta.dist); }
    this.steps.push({ speaker, listener, text, t: this.t, fl: this.fl, cfl: this.cfl, kind: opt.kind || 'radio', stage: this.stage, cue: opt.cue || '', meta });
    return this;
  }
  coord(a, b, lines, cue = '') { lines.forEach((l, i) => this.say(i % 2 ? b : a, i % 2 ? a : b, l, { kind: 'coord', cue: i ? '' : cue })); return this; }
  // задача ПК на визуализированном графике сектора (выполняется после последнего добавленного шага)
  mark(sector, type, o) { this.tasks.push({ sector, type, after: this.steps.length - 1, ...o }); return this; }
  // задача РЛК / ПК в табличном графике
  table(sector, row) { this.tasks.push({ sector, type: 'table', after: this.steps.length - 1, row }); return this; }
}

  <section class="ref">${Object.entries(REF).map(([h, t]) => `<div><h3 style="margin:0 0 8px;font-size:15px">${esc(h)}</h3><pre>${esc(t)}</pre></div>`).join('')}</section></div>`;
  $('#back').onclick = renderHome;
}

// ═════ TELEGRAM MINI APP ═════
const tg = { w: null,
  init() { if (!/tgWebApp/.test(location.hash + location.search)) return;
    const s = document.createElement('script'); s.src = 'https://telegram.org/js/telegram-web-app.js';
    s.onload = () => { const w = window.Telegram && Telegram.WebApp; if (!w) return; tg.w = w; w.ready(); w.expand();
      try { w.setHeaderColor(cssv('--bg')); w.setBackgroundColor(cssv('--bg')); } catch (e) {}
      document.documentElement.dataset.theme = w.colorScheme === 'dark' ? 'dark' : 'light';
      w.BackButton.onClick(() => { document.querySelector('.modal')?.remove(); lastStage = null; renderHome(); });
      tg.back(S.view !== 'home'); };
    document.head.appendChild(s); },
  back(on) { if (!tg.w) return; on ? tg.w.BackButton.show() : tg.w.BackButton.hide(); } };

addEventListener('resize', () => { if (S.view === 'ex') { if (S.screen === 'radar') drawRadar(); if (S.screen === 'graph') renderGraph(); } });
tg.init(); renderHome();
</script></body></html>
